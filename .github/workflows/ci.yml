name: MangaTok Studio CI

on:
  push:
    branches:
      - main
      - 'arena/**'
  pull_request:
    branches:
      - main
      - 'arena/**'

jobs:
  test:
    name: Test & Quality Gate (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install system dependencies (FFmpeg)
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg libsndfile1

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install .
          pip install pytest pytest-cov httpx fastapi uvicorn pillow jinja2 pydantic

      - name: Run Schema and Pydantic validation
        run: |
          python -c "
          import json
          from manga_studio.core.models.character import CharacterSheet, CharacterBible
          from manga_studio.core.models.storyboard import Storyboard
          from manga_studio.core.models.qc import QCReport
          print('All domain models and schemas imported and validated successfully.')
          "

      - name: Run Pytest Suite with Coverage
        run: |
          pytest --cov=manga_studio --cov-report=term-missing --cov-report=xml --cov-fail-under=85

      - name: Verify End-to-End CLI Run
        run: |
          python -m manga_studio.cli.main \
            --story tests/fixtures/conte.txt \
            --characters-dir tests/fixtures/personnages \
            --output-dir ci_demo_output \
            --profile research \
            --territory EU \
            --use-mock-video
          test -f ci_demo_output/conte_final.mp4
          test -f ci_demo_output/manifests/run_report.json
          test -f ci_demo_output/subtitles/conte.srt
          echo "End-to-End CLI validation passed."
