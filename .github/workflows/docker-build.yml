name: Docker Container Build

on:
  push:
    branches:
      - main
      - 'arena/**'
  pull_request:
    branches:
      - main

jobs:
  docker:
    name: Build and Validate Docker Image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker CPU image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: mangatok-studio:latest
          load: true

      - name: Smoke test Docker container
        run: |
          docker run -d --name test-mangatok -p 8000:8000 mangatok-studio:latest
          trap 'docker rm -f test-mangatok || true' EXIT
          for _ in {1..15}; do curl -fsS http://localhost:8000/api/status && exit 0; sleep 2; done
          docker logs test-mangatok
          exit 1

      - name: Validate Compose frontend-to-API proxy
        env:
          MANGA_STUDIO_API_KEY: ci-compose-api-key
        run: |
          docker compose up -d --build
          trap 'docker compose down -v --remove-orphans' EXIT
          for _ in {1..30}; do curl -fsS http://localhost:3000/api/status && exit 0; sleep 2; done
          docker compose logs
          exit 1
