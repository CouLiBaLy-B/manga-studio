[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "manga-studio"
version = "1.0.0"
description = "MangaTok Studio — Suite de génération vidéo orientée manga et contes animés"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115.0,<1.0.0",
    "uvicorn>=0.30.0,<1.0.0",
    "python-multipart>=0.0.18,<1.0.0",
    "redis>=5.0.0,<7.0.0",
    "rq>=2.0.0,<3.0.0",
    "pydantic>=2.7.0,<3.0.0",
    "pillow>=10.0.0,<13.0.0",
    "jinja2>=3.1.0,<4.0.0"
]

[project.optional-dependencies]
dev = [
    "httpx>=0.27.0,<1.0.0",
    "pytest>=8.0.0,<10.0.0",
    "pytest-cov>=5.0.0,<8.0.0",
    "ruff>=0.8.0,<1.0.0"
]

[project.scripts]
manga-studio = "manga_studio.cli.main:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["manga_studio*"]
