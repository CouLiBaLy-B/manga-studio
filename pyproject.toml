[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "manga-studio"
version = "1.0.0"
description = "MangaTok Studio — Suite de génération vidéo orientée manga et contes animés"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.0.0",
    "pillow>=9.0.0",
    "jinja2>=3.0.0",
    "fastapi>=0.100.0",
    "uvicorn>=0.20.0",
    "python-multipart>=0.0.9",
    "httpx>=0.24.0",
    "pytest>=7.0.0"
]

[project.scripts]
manga-studio = "manga_studio.cli.main:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["manga_studio*"]
