version: '3.8'

services:
  redis:
    image: redis:7-alpine
    container_name: mangatok-studio-redis
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    restart: unless-stopped

  # Frontend Next.js Dashboard
  manga-studio-frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        BACKEND_URL: http://manga-studio-app:8000
    container_name: mangatok-studio-frontend
    ports:
      - "3000:3000"
    depends_on:
      - manga-studio-app
    restart: unless-stopped

  # Service standard MangaTok Studio (Backend FastAPI / Profil Research)
  manga-studio-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mangatok-studio-app
    ports:
      - "8000:8000"
    depends_on:
      - redis
    environment:
      - DEPLOYMENT_PROFILE=research
      - TERRITORY=EU
      - ENABLE_BEDROCK=false
      - ENABLE_H3_LOCAL=false
      - ALLOW_REMOTE_DATA_TRANSFER=false
      - MAX_MONTHLY_BUDGET_USD=10.0
      - MAX_RUN_BUDGET_USD=2.0
      - VRAM_CEILING_GB=22.0
      - MANGA_STUDIO_ENV=production
      - MANGA_STUDIO_API_KEY=${MANGA_STUDIO_API_KEY:?MANGA_STUDIO_API_KEY must be set}
      - MANGA_STUDIO_CORS_ORIGINS=${MANGA_STUDIO_CORS_ORIGINS:-http://localhost:3000}
      - MANGA_STUDIO_OUTPUT_ROOT=/app/output
      - MANGA_STUDIO_FIXTURES_ROOT=/app/fixtures
      - MANGA_STUDIO_REDIS_URL=redis://redis:6379/0
      - MANGA_STUDIO_API_RATE_LIMIT_PER_MINUTE=${MANGA_STUDIO_API_RATE_LIMIT_PER_MINUTE:-30}
    volumes:
      - ./output:/app/output
      - ./demo_output:/app/demo_output
      - ./tests/fixtures:/app/fixtures:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/status"]
      interval: 15s
      timeout: 5s
      retries: 3

  manga-studio-worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mangatok-studio-worker
    command: rq worker manga-studio
    depends_on:
      - redis
    environment:
      - MANGA_STUDIO_ENV=production
      - MANGA_STUDIO_REDIS_URL=redis://redis:6379/0
      - MANGA_STUDIO_QUEUE_NAME=manga-studio
      - MANGA_STUDIO_OUTPUT_ROOT=/app/output
      - MANGA_STUDIO_FIXTURES_ROOT=/app/fixtures
    volumes:
      - ./output:/app/output
      - ./tests/fixtures:/app/fixtures:ro
    restart: unless-stopped

  # Service GPU Accéléré (RTX 4090 / CUDA 12.4)
  manga-studio-gpu:
    build:
      context: .
      dockerfile: Dockerfile.gpu
    container_name: mangatok-studio-gpu
    ports:
      - "8001:8000"
    depends_on:
      - redis
    environment:
      - DEPLOYMENT_PROFILE=research
      - TERRITORY=EU
      - ENABLE_BEDROCK=false
      - ENABLE_H3_LOCAL=false
      - ALLOW_REMOTE_DATA_TRANSFER=false
      - VRAM_CEILING_GB=22.0
      - NVIDIA_VISIBLE_DEVICES=all
      - CUDA_VISIBLE_DEVICES=0
      - MANGA_STUDIO_ENV=production
      - MANGA_STUDIO_API_KEY=${MANGA_STUDIO_API_KEY:?MANGA_STUDIO_API_KEY must be set}
      - MANGA_STUDIO_CORS_ORIGINS=${MANGA_STUDIO_CORS_ORIGINS:-http://localhost:3000}
      - MANGA_STUDIO_OUTPUT_ROOT=/app/output
      - MANGA_STUDIO_REDIS_URL=redis://redis:6379/0
    volumes:
      - ./output:/app/output
      - ./demo_output:/app/demo_output
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    restart: unless-stopped
    profiles:
      - gpu

volumes:
  redis_data:
